name: Dispatch Gentle Reminders

on:
  schedule:
    # Five-minute cadence; dispatcher checks a ten-minute due window and
    # uses Firestore claims to avoid duplicate delivery across overlapping runs.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mfl-reminder-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install server-only push dependencies
        run: npm install --no-save --package-lock=false web-push firebase-admin

      - name: Run reminder schedule tests
        run: node --test scripts/reminder-schedule.test.mjs

      - name: Run reminders dispatcher
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || 'mailto:support@myfulfilledlife.app' }}
        run: node scripts/dispatch-reminders.mjs
